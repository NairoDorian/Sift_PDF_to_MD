[package]
name = "sift-core"
description = "Sift core: text layer, layout, surya 2.5 and Gemma 4 on llama.cpp, checks against the PDF, Markdown"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
libloading.workspace = true
png.workspace = true
regex.workspace = true
fancy-regex.workspace = true
unicode-general-category.workspace = true
unicode-normalization.workspace = true
reqwest.workspace = true
zip.workspace = true
toml.workspace = true
base64.workspace = true
candle-core.workspace = true
candle-nn.workspace = true
log.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }

[features]
# Layout model on the GPU through candle's CUDA backend (needs the CUDA toolkit to build).
# The default build runs layout on the CPU and needs no toolkit.
cuda = ["candle-core/cuda", "candle-nn/cuda"]
