[workspace]
resolver = "3"
members = ["crates/sift-core", "crates/sift-cli", "app/src-tauri"]

[workspace.package]
version = "1.0.0-alpha.3"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.99"

# Strict dependencies (MASTER_PLAN VD14): ZER0's set first, each addition with its reason in
# docs/DEPENDENCIES.md. No second inference runtime next to llama.cpp for language models.
[workspace.dependencies]
anyhow = "1.0.105"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11.2"
libloading = "0.9.1"
png = "0.18.1"
regex = "1.13.2"
fancy-regex = "0.20.2"
unicode-general-category = "1.1"
unicode-normalization = "0.1.26"
clap = { version = "4.6.10", features = ["derive", "env"] }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls", "gzip"] }
zip = { version = "9.8.2", default-features = false, features = ["deflate"] }
toml = "1.2.3"
base64 = "0.23.1"
candle-core = "0.11.1"
candle-nn = "0.11.1"
log = "0.4.35"
# The window's typed commands (app/src/lib/bindings.ts, generated): exactly the Specta that
# tauri-specta's Tauri 3 fork builds against (docs/DEPENDENCIES.md).
specta = { version = "=2.0.0-rc.28", features = ["derive", "serde_json"] }

[profile.release]
debug = 1
codegen-units = 16

# The layout model runs in the dev loop too: keep its math optimised in debug builds.
[profile.dev.package."*"]
opt-level = 3
[profile.dev]
opt-level = 1
